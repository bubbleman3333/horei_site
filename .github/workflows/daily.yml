# 毎朝 6 時（日本時間）に e-Gov 法令 API から取り込み、サイトを生成して GitHub Pages に配信する。
# main に push したときも生成だけ走る（取り込みはしない。取り込みが push を呼んで無限ループになるのを防ぐ）。
name: daily

on:
  schedule:
    - cron: "23 21 * * *"   # 21:23 UTC = 06:23 JST（毎時 0 分は混んで遅れるのでずらす）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: e-Gov 法令 API から取り込む
        if: github.event_name != 'push'
        run: python -m horei fetch
      - name: 取り込んだデータをコミット
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/laws
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ更新 $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
      - name: テスト
        run: python -m pytest -q
      - name: サイト生成
        run: python -m horei build --site-url "https://horei-watch.rakunowa.workers.dev"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
