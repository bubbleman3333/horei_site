{% extends "base.html" %}
{% block title %}{{ title }} | {{ site.name }}{% endblock %}
{% block description %}{{ description }}{% endblock %}
{% block content %}
<nav class="crumbs"><a href="{{ url() }}">ホーム</a> › {{ title }}</nav>
<h1>{{ title }}</h1>
<p class="lead">{{ description }} 条件を変えるとその場で結果が変わります。</p>
<form id="f" class="filter" onsubmit="return false">
  <label>分野
    <select name="category"><option value="">すべて</option>{% for name, slug, n in category_index %}<option value="{{ name }}">{{ name }}（{{ n }}）</option>{% endfor %}</select>
  </label>
  <label>種別
    <select name="type"><option value="">すべて</option>{% for name, slug, n in type_index %}<option value="{{ slug }}">{{ name }}（{{ n }}）</option>{% endfor %}</select>
  </label>
  <label>所管府省
    <select name="ministry"><option value="">すべて</option>{% for name, slug, n in ministry_index %}<option value="{{ name }}">{{ name }}（{{ n }}）</option>{% endfor %}</select>
  </label>
  <label>状態
    <select name="status"><option value="">すべて</option><option value="scheduled">施行予定あり</option><option value="enforced">施行中</option><option value="repealed">廃止・失効</option></select>
  </label>
  <label class="grow">キーワード（法令名・読み・法令番号）
    <input type="search" name="q" placeholder="例: 労働、育児休業、ろうどう、令和八年">
  </label>
  <label>並び順
    <select name="sort"><option value="upcoming">施行予定が近い順</option><option value="enforced">施行日が新しい順</option><option value="promulgated">公布日が新しい順</option><option value="title">法令名順</option></select>
  </label>
</form>
<p id="count" class="lead"></p>
<ul id="results" class="cards"></ul>
<p id="more-wrap"><button id="more" class="button ghost" type="button">さらに表示</button></p>
<script>
(function () {
  // ページからの相対パスにしておくと、ローカル確認（localhost / 127.0.0.1）でも公開先でも同一オリジンで読める
  var DATA_URL = '../search.json';
  var BASE = '../law/';
  var form = document.getElementById('f');
  var list = document.getElementById('results');
  var countEl = document.getElementById('count');
  var moreBtn = document.getElementById('more');
  var rows = [], shown = 0, filtered = [];
  var PAGE = 50;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function jdate(s) {
    if (!s) return '';
    var p = s.split('-');
    return Number(p[0]) + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
  }
  function daysLeft(e) {
    if (!e) return null;
    var d = new Date(e + 'T00:00:00+09:00'), t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((d - t) / 86400000);
  }
  function card(r) {
    var label = r.s === 'scheduled' ? jdate(r.u) + ' 施行予定' : (r.s === 'repealed' ? '廃止・失効' : '施行中');
    var left = r.s === 'scheduled' ? daysLeft(r.u) : null;
    return '<li class="card"><a class="card-title" href="' + BASE + esc(r.i) + '/">' + esc(r.t) + '</a>' +
      '<div class="card-meta"><span class="badge ' + r.s + '">' + esc(label) + (left !== null ? '（あと' + left + '日）' : '') + '</span>' +
      '<span class="tag">' + esc(r.yl) + '</span>' + (r.c ? '<span class="tag">' + esc(r.c) + '</span>' : '') +
      (r.p ? '<span>公布 ' + jdate(r.p) + '</span>' : '') + (r.e ? '<span>現行 ' + jdate(r.e) + '施行</span>' : '') +
      '</div><p class="card-catch">' + esc(r.n) + '</p></li>';
  }
  function apply() {
    var v = {};
    Array.prototype.forEach.call(form.elements, function (el) { if (el.name) v[el.name] = el.value.trim(); });
    var q = v.q.toLowerCase();
    filtered = rows.filter(function (r) {
      if (v.category && r.c !== v.category) return false;
      if (v.type && r.y !== v.type) return false;
      if (v.ministry && (r.m || []).indexOf(v.ministry) < 0) return false;
      if (v.status && r.s !== v.status) return false;
      if (q && (r.t + ' ' + (r.k || '') + ' ' + (r.b || '') + ' ' + (r.n || '')).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var far = '9999-99-99';
    filtered.sort(function (a, b) {
      if (v.sort === 'title') return a.t < b.t ? -1 : 1;
      if (v.sort === 'promulgated') return (b.p || '') < (a.p || '') ? -1 : 1;
      if (v.sort === 'enforced') return (b.e || '') < (a.e || '') ? -1 : 1;
      return (a.u || far) < (b.u || far) ? -1 : 1;
    });
    list.innerHTML = ''; shown = 0; showMore();
    var p = new URLSearchParams();
    Object.keys(v).forEach(function (k) { if (v[k] && !(k === 'sort' && v[k] === 'upcoming')) p.set(k, v[k]); });
    history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p.toString() : ''));
  }
  function showMore() {
    var chunk = filtered.slice(shown, shown + PAGE);
    list.insertAdjacentHTML('beforeend', chunk.map(card).join(''));
    shown += chunk.length;
    countEl.textContent = filtered.length + ' 件が該当（' + shown + ' 件を表示）';
    moreBtn.style.display = shown < filtered.length ? '' : 'none';
  }
  moreBtn.addEventListener('click', showMore);
  form.addEventListener('input', apply);
  form.addEventListener('change', apply);
  fetch(DATA_URL).then(function (r) { return r.json(); }).then(function (data) {
    rows = data;
    var p = new URLSearchParams(location.search);
    Array.prototype.forEach.call(form.elements, function (el) { if (el.name && p.has(el.name)) el.value = p.get(el.name); });
    apply();
  });
})();
</script>
{% endblock %}
